# Installed by deploy/debian/deploy_backtest_web.sh.
# This file is included from nginx.conf's http context by Debian's default
# sites-enabled include, so limit_req_zone is valid here.

limit_req_zone $binary_remote_addr zone=jzbe_backtest_per_ip:10m rate=10r/m;

server {
    listen 15443 ssl http2;
    listen [::]:15443 ssl http2;
    server_name jzbe.jazebeh.ir;

    ssl_certificate     /etc/letsencrypt/live/jzbe.jazebeh.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jzbe.jazebeh.ir/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss://jzbe.jazebeh.ir:15443; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com" always;

    access_log /var/log/nginx/jzbe.jazebeh.ir-backtest.access.log;
    error_log  /var/log/nginx/jzbe.jazebeh.ir-backtest.error.log warn;

    # The panel can start CPU- and network-intensive backtests. Keep the
    # listener authenticated and rate-limited even when it is not public.
    auth_basic "Simpler-Trader Backtest";
    auth_basic_user_file /etc/nginx/.htpasswd-simpler-trader-backtest;
    client_max_body_size 64k;

    location / {
        limit_req zone=jzbe_backtest_per_ip burst=10 nodelay;
        proxy_pass http://127.0.0.1:9092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:9092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
